<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      .button-react {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        border-radius: 4px;
        padding: 10px 20px 10px 20px;
        font-weight: 500px;
        font-size: 20px;
      }

      .button-on {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        border-radius: 4px;
        padding: 10px 20px 10px 20px;
        font-weight: 500px;
        font-size: 20px;
      }
      .button-off {
        background-color: rgb(220,53,69);
        color: white;
        border: none;
        border-radius: 4px;
        padding: 10px 20px 10px 20px;
        font-weight: 500px;
        font-size: 20px;
      }
      .app-container {
        display: flex;
        justify-content: end;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const container = document.querySelector('.js-container'); 
      
      let isButtonOn = true;

      function Button () {
        const [current, setButtonStats] = React.useState(isButtonOn);

        function changeButtonStats () {
          if(isButtonOn) {
            isButtonOn = false;
          }else{
            isButtonOn = true;
          }
          setButtonStats(isButtonOn);
        }

        return (
          <button onClick={changeButtonStats} className={isButtonOn ? 'button-on' : 'button-off'}>{isButtonOn ? 'ON' : 'OFF'}</button>
        );
      }

      function App () {
        return (
          <div className="app-container">
            <Button />
          </div>
        );
      }

      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
