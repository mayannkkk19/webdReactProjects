<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const container = document.querySelector('.js-container');  

      function Button ({count, setCount, increase}) {
        return (
          <button onClick={increase}>Clicked {count} times</button>
        );
      }

      function ResetButton ({resetCount}) {
        return (
          <button onClick={resetCount}>Reset</button>
        );
      }

      function App () {
        const [count, setCount] = React.useState(0);
        function increase() {
          setCount(count + 1);
        }
        function reset () {
          setCount(0);
        }
        return (
          <>
            <Button count={count} setCount={setCount} increase={increase} />
            <Button count={count} setCount={setCount} increase={increase} />
            <ResetButton resetCount={reset} />
          </>
        ); 
      }

      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
